<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#65A30D" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>活动 · Seven戚</title>
<link rel="stylesheet" href="./theme.css" />
<script src="./vendor/supabase.js"></script>
<script src="common.js"></script>
<style>
.app-header .back{background:none;border:none;cursor:pointer;color:var(--text);display:flex;padding:4px;border-radius:8px;transition:var(--transition-smooth);}
.app-header .back:hover{background:var(--border);}
.app-header .back svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.app-header .title{font-weight:700;font-size:1.05em;}
.act-body{flex:1;overflow-y:auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom));}
.act-list{display:flex;flex-direction:column;gap:16px;}
.act-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:var(--transition-smooth);}
.act-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.act-card .ac-badge{position:absolute;top:0;right:0;background:var(--brand);color:#fff;font-size:.65em;font-weight:600;padding:6px 16px;border-radius:0 var(--radius-lg) 0 16px;}
.act-card .ac-badge.ended{background:var(--text-light);}
.act-card .ac-title{font-weight:700;font-size:1.1em;margin-bottom:8px;display:flex;align-items:center;gap:8px;color:var(--text);}
.act-card .ac-title svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;}
.act-card .ac-desc{font-size:.88em;color:var(--text-muted);line-height:1.6;}
.act-card .ac-desc b{color:var(--text);font-weight:600;}
.act-card .ac-time{font-size:.75em;color:var(--text-light);margin-top:12px;}
.act-btn{width:100%;margin-top:16px;padding:14px;border-radius:var(--radius-pill);border:none;background:var(--brand);color:#fff;font-weight:600;font-size:1em;cursor:pointer;font-family:inherit;transition:var(--transition-smooth);box-shadow:0 4px 12px rgba(132,204,22,0.25);}
.act-btn:hover:not(:disabled){background:var(--brand-light);transform:translateY(-1px);}
.act-btn:active:not(:disabled){transform:scale(.98);}
.act-btn:disabled{opacity:.5;box-shadow:none;pointer-events:none;}
.act-btn.done{background:var(--brand-bg);color:var(--brand-dark);box-shadow:none;}
.bubble-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
.bubble-item{padding:12px 8px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);text-align:center;font-size:.8em;font-weight:600;cursor:pointer;transition:var(--transition-smooth);line-height:1.4;background:var(--bg-surface);color:var(--text-muted);}
.bubble-item:hover{border-color:var(--brand-light);background:var(--brand-bg);color:var(--brand-dark);}
.bubble-item.selected{border-color:var(--brand);background:var(--brand-bg);color:var(--brand-dark);box-shadow:0 0 0 3px rgba(132,204,22,.2);}
.empty{text-align:center;color:var(--text-muted);padding:60px 20px;font-size:.9em;line-height:1.8;}
</style>
</head>
<body>
<div id="mainApp">
  <div class="app-header">
    <button class="back" onclick="history.back()"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <span class="title">活动中心</span>
    <div style="width:32px;"></div>
  </div>
  <div class="act-body">
    <div class="act-list" id="actList"></div>
  </div>
</div>
<div id="toast"></div>
<script>
(function(){
  var currentUser = getSessionUser();
  if (!currentUser || !currentUser.id) { window.location.href = './index.html'; return; }

  var GIFT_BUBBLES = [{ id: 25, name: '流光边框' }, { id: 26, name: '呼吸发光' }, { id: 35, name: '猫爪' }, { id: 36, name: '樱花' }];
  var GIFT_DEADLINE = new Date('2026-10-30T23:59:59+08:00');
  var dailyClaimed = false; var bubbleClaimed = false; var selectedBubble = null;

  function showToast(msg) { window.showCustomToast(msg); }

  function renderActivity(){
    var giftEnded = new Date() > GIFT_DEADLINE;
    var list = document.getElementById('actList');
    var html = '<div class="act-card"><div class="ac-badge">永久</div><div class="ac-title"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>每日登录奖励</div><div class="ac-desc">每天登录即可随机获得 <b>1~8</b> 小七币，每个自然日限领一次。</div><button class="act-btn" id="dailyBtn" disabled>检测中…</button></div>';
    html += '<div class="act-card"><div class="ac-badge' + (giftEnded ? ' ended' : '') + '">' + (giftEnded ? '已结束' : '限时') + '</div><div class="ac-title"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.9 6.4.5-4.9 4.2 1.5 6.3L12 15.8 6.6 18.9l1.5-6.3L3.2 8.4l6.4-.5z"/></svg>限时·领取 30 天气泡</div><div class="ac-desc">' + (giftEnded ? '活动已结束，感谢参与～' : '在 <b>2026-10-30</b> 前，可从下方任选一款气泡，免费使用 <b>30 天</b>。每人限领一个。') + '</div><div class="ac-time">截止：2026-10-30 23:59</div>';
    if (!giftEnded && !bubbleClaimed) {
      html += '<div class="bubble-grid" id="bubbleGrid">' + GIFT_BUBBLES.map(function(b){ return '<div class="bubble-item" data-id="' + b.id + '">' + b.name + '</div>'; }).join('') + '</div><button class="act-btn" id="giftBtn" disabled style="margin-top:20px;">请选择一款气泡</button>';
    } else if (bubbleClaimed) { html += '<button class="act-btn done" disabled>✓ 已领取</button>'; }
    html += '</div>';
    list.innerHTML = html;

    var dailyBtn = document.getElementById('dailyBtn');
    if (dailyClaimed) { dailyBtn.className = 'act-btn done'; dailyBtn.textContent = '✓ 今日已领取'; dailyBtn.disabled = true; } 
    else { dailyBtn.disabled = false; dailyBtn.textContent = '领取今日奖励'; dailyBtn.onclick = claimDaily; }

    var grid = document.getElementById('bubbleGrid');
    if (grid) {
      grid.querySelectorAll('.bubble-item').forEach(function(el){
        el.onclick = function(){
          grid.querySelectorAll('.bubble-item').forEach(function(x){ x.classList.remove('selected'); });
          this.classList.add('selected'); selectedBubble = parseInt(this.dataset.id, 10);
          var gb = document.getElementById('giftBtn'); if (gb) { gb.disabled = false; gb.textContent = '领取该气泡'; }
        };
      });
      var gb = document.getElementById('giftBtn'); if (gb) gb.onclick = claimBubble;
    }
  }

  async function claimDaily(){
    var btn = document.getElementById('dailyBtn'); btn.disabled = true;
    try {
      // 调用安全 RPC
      var r = await window.sb.rpc('claim_daily_bonus');
      if (r.error) throw r.error;
      if (r.data.ok) {
        dailyClaimed = true; showToast('恭喜获得 ' + r.data.amount + ' 小七币！');
        var u = await window.sb.rpc('get_my_profile');
        if (u.data) { currentUser.coins = u.data.coins; setSessionUser(currentUser); }
        renderActivity();
      } else if (r.data.already) {
        dailyClaimed = true; showToast('今天已经领过啦，明天再来～'); renderActivity();
      }
    } catch(e) { showToast('领取失败：' + e.message); btn.disabled = false; }
  }

  async function claimBubble(){
    if (!selectedBubble) { showToast('请先选择气泡'); return; }
    var btn = document.getElementById('giftBtn'); btn.disabled = true;
    try {
      // 调用安全 RPC 领皮肤
      var r = await window.sb.rpc('claim_bubble_gift', { p_skin_id: selectedBubble });
      if (r.error) throw r.error;
      if (r.data.ok) {
        bubbleClaimed = true;
        var exp = new Date(r.data.expire_at).toLocaleDateString('zh-CN');
        showToast('领取成功！气泡有效至 ' + exp); renderActivity();
      } else { showToast(r.data.message || '领取失败'); btn.disabled = false; }
    } catch(e) { showToast('领取失败：' + e.message); btn.disabled = false; }
  }

  async function checkBubbleClaimed(){
    try { var r = await window.sb.from('bubble_gift_claims').select('id').eq('user_id', currentUser.id).limit(1); bubbleClaimed = (r.data && r.data.length > 0); } catch(e) { bubbleClaimed = false; }
  }

  async function init(){
    if(window.showLoading) window.showLoading();
    try { await checkBubbleClaimed(); renderActivity(); await claimDaily(); } finally { if(window.hideLoading) window.hideLoading(); }
  }
  init();
})();
</script>
</body>
</html>
