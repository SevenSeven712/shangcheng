<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#65A30D" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>发帖 · Seven戚</title>
<link rel="stylesheet" href="./theme.css" />
<script src="./vendor/supabase.js"></script>
<style>
.app-header .back-btn { background: none; border: none; cursor: pointer; color: var(--text); display: flex; align-items: center; padding: 4px; text-decoration: none; border-radius: 8px; }
.app-header .back-btn:hover { background: var(--border); }
.app-header .back-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.app-header .title { font-weight: 700; font-size: 1em; }
.app-header .placeholder { width: 32px; }

.app-content { flex: 1; overflow-y: auto; padding: 20px 16px; -webkit-overflow-scrolling: touch; }
.field-group { margin-bottom: 20px; }
.field-group label { display: block; font-size: 0.8em; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
.field-group input, .field-group select { width: 100%; padding: 14px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); background: var(--bg-surface); font-family: inherit; font-size: 0.95em; outline: none; color: var(--text); transition: var(--transition-smooth); }
.field-group input:focus, .field-group select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-bg); }

.editor-container { position: relative; }
.editor-toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; padding: 8px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); }
.editor-toolbar button { background: none; border: none; cursor: pointer; padding: 8px 12px; border-radius: 8px; color: var(--text-muted); transition: var(--transition-smooth); display: flex; align-items: center; font-weight: 600; }
.editor-toolbar button:hover { background: var(--brand-bg); color: var(--brand-dark); }
.editor-toolbar button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.editor-content { min-height: 240px; max-height: 500px; overflow-y: auto; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 16px; background: var(--bg-surface); font-size: 0.95em; line-height: 1.7; outline: none; word-break: break-word; transition: var(--transition-smooth); }
.editor-content:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-bg); }
.editor-content img { max-width: 100%; border-radius: 8px; margin: 8px 0; }

.actions { display: flex; gap: 12px; margin-top: 24px; }
.actions button { flex: 1; padding: 14px; border-radius: var(--radius-pill); border: none; font-weight: 600; font-size: 1em; cursor: pointer; font-family: inherit; transition: var(--transition-smooth); }
.actions button:active { transform: scale(0.96); }
.actions .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 4px 12px rgba(132,204,22,0.25); }
.actions .btn-primary:disabled { opacity: 0.5; pointer-events: none; box-shadow: none; }
.actions .btn-secondary { background: var(--bg); color: var(--text-muted); }
</style>
</head>
<body>
<div id="mainApp">
  <div class="app-header">
    <a href="posts.html" class="back-btn" title="返回帖子广场">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <span class="title">发布新帖</span>
    <div class="placeholder"></div>
  </div>

  <div class="app-content">
    <div class="field-group">
      <label>标题（选填）</label>
      <input type="text" id="postTitleInput" maxlength="100" placeholder="输入帖子标题..." />
    </div>

    <div class="field-group">
      <label>分类</label>
      <select id="postCategorySelect">
        <option value="">加载中...</option>
      </select>
    </div>

    <div class="field-group">
      <label>正文内容</label>
      <div class="editor-container">
        <div class="editor-toolbar" id="editorToolbar">
          <button type="button" onclick="execCommand('bold')" title="粗体"><b>B</b></button>
          <button type="button" onclick="execCommand('italic')" title="斜体"><i>I</i></button>
          <button type="button" onclick="execCommand('underline')" title="下划线"><u>U</u></button>
          <button type="button" onclick="insertImage()" title="插入图片">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>
        </div>
        <div class="editor-content" id="richEditor" contenteditable="true" placeholder="写点什么..."></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-secondary" onclick="window.location.href='./posts.html'">取消</button>
      <button class="btn-primary" id="submitPostBtn">发布</button>
    </div>
  </div>
</div>

<script src="./common.js"></script>
<script>
var currentUser = getSessionUser();
if (!currentUser || !currentUser.id) { window.location.href = './index.html'; }

function showToast(msg) { window.showCustomToast(msg); }
function execCommand(cmd) { document.execCommand(cmd, false, null); document.getElementById('richEditor').focus(); }

async function loadCategories() {
    try {
        var res = await window.sb.from('categories').select('*').order('sort_order', { ascending: true });
        if (res.error) throw res.error;
        var categories = res.data || [];
        var select = document.getElementById('postCategorySelect');
        var available = categories.filter(function(c) { return c.name !== '未分类' && (!c.is_admin_only || currentUser.is_admin); });
        if (!available.length) { select.innerHTML = '<option value="null">默认分类</option>'; return; }
        select.innerHTML = available.map(function(c) { return '<option value="' + c.id + '">' + escapeHtml(c.name) + (c.is_admin_only ? ' (专属)' : '') + '</option>'; }).join('');
    } catch(e) { document.getElementById('postCategorySelect').innerHTML = '<option value="null">加载失败</option>'; }
}

async function uploadImage(file) {
    if (file.size > 5 * 1024 * 1024) throw new Error('图片大小不能超过 5MB');
    var ext = file.name.split('.').pop() || 'png';
    var path = currentUser.id + '/' + Date.now() + '.' + ext;
    var up = await window.sb.storage.from('posts').upload(path, file);
    if (up.error) throw up.error;
    return window.sb.storage.from('posts').getPublicUrl(path).data.publicUrl;
}

function insertImage() {
    var input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
    input.onchange = async function(e) {
        var file = e.target.files[0]; if (!file) return;
        try { showToast('图片上传中...'); var url = await uploadImage(file); document.execCommand('insertImage', false, url); } catch(err) { showToast('上传失败：' + err.message); }
    };
    input.click();
}

document.getElementById('submitPostBtn').onclick = async function() {
    var title = document.getElementById('postTitleInput').value.trim();
    var categoryVal = document.getElementById('postCategorySelect').value;
    var category_id = (categoryVal && categoryVal !== 'null') ? parseInt(categoryVal, 10) : null;
    var content = document.getElementById('richEditor').innerHTML.trim();
    
    if (!content || content === '<br>' || content === '<div><br></div>') return showToast('请输入正文内容');

    var btn = this; btn.disabled = true; btn.textContent = '发布中...';
    try {
        // 走安全 RPC 发帖
        var r = await window.sb.rpc('create_post', { p_title: title, p_content: content, p_category_id: category_id });
        if (r.error) throw r.error;
        if (!r.data.success) throw new Error(r.data.message);
        showToast('帖子发布成功！奖励 2 小七币');
        setTimeout(function() { window.location.href = './posts.html'; }, 1000);
    } catch(e) {
        showToast('发布失败：' + e.message);
        btn.disabled = false; btn.textContent = '发布';
    }
};
loadCategories();
</script>
</body>
</html>
