<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#65A30D" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>皮肤商店 · Seven戚</title>
<link rel="stylesheet" href="./theme.css" />
<link rel="stylesheet" href="bubbles.css" />
<script src="./vendor/supabase.js"></script>
<script src="common.js"></script>
<style>
.app-header .back{background:none;border:none;cursor:pointer;color:var(--text);display:flex;padding:4px;border-radius:8px;transition:var(--transition-smooth);}
.app-header .back:hover{background:var(--border);}
.app-header .back svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.app-header .title{font-weight:700;font-size:1.05em;flex:1;}
.coin-box{display:flex;align-items:center;gap:6px;background:var(--brand-bg);border:1px solid var(--brand-light);border-radius:var(--radius-pill);padding:6px 14px;font-weight:700;font-size:.9em;color:var(--brand-dark);}
.coin-box svg{width:16px;height:16px;}

.shop-body{flex:1;overflow-y:auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom));}

.act-banner{background:linear-gradient(135deg, var(--brand-light), var(--brand));color:#fff;border-radius:var(--radius-md);padding:20px;margin-bottom:20px;position:relative;overflow:hidden;display:none;box-shadow:var(--shadow-md);}
.act-banner::after{content:'';position:absolute;right:-20px;top:-20px;width:120px;height:120px;background:rgba(255,255,255,.2);border-radius:50%;filter:blur(20px);}
.act-banner.show{display:block;}
.act-banner .act-title{font-weight:700;font-size:1.1em;margin-bottom:6px;position:relative;z-index:1;}
.act-banner .act-desc{font-size:.85em;opacity:.95;line-height:1.5;position:relative;z-index:1;}
.act-banner .act-off{display:inline-block;background:#fff;color:var(--brand-dark);font-size:.75em;font-weight:700;padding:4px 12px;border-radius:var(--radius-pill);margin-top:12px;position:relative;z-index:1;}

.shop-tabs{display:flex;gap:8px;margin-bottom:20px;background:var(--bg);padding:4px;border-radius:var(--radius-pill);border:1px solid var(--border);}
.shop-tab{flex:1;padding:10px;border:none;background:transparent;border-radius:var(--radius-pill);font-family:inherit;font-size:.9em;font-weight:600;color:var(--text-muted);cursor:pointer;transition:var(--transition-smooth);}
.shop-tab.active{background:var(--bg-surface);color:var(--brand);box-shadow:var(--shadow-sm);}

.shop-grid{column-count:2;column-gap:16px;}
.shop-card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:16px;display:inline-flex;flex-direction:column;align-items:flex-start;gap:12px;cursor:pointer;transition:var(--transition-smooth);position:relative;width:100%;margin-bottom:16px;break-inside:avoid;-webkit-column-break-inside:avoid;box-shadow:var(--shadow-sm);}
.shop-card:hover{border-color:var(--brand-light);transform:translateY(-2px);box-shadow:var(--shadow-md);}
.shop-card:active{transform:scale(.98);}
.shop-card.owned{border-color:var(--brand);background:var(--brand-bg);}
.shop-card .preview{width:100%;display:flex;align-items:center;justify-content:center;min-height:60px;padding:4px 0;}
.shop-card .preview .row{margin:0;display:flex;max-width:100%;}
.shop-card .preview .bubble{padding:8px 12px;font-size:.85em;line-height:1.4;white-space:normal;word-break:break-word;max-width:100%;}
.shop-card .info{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
.shop-card .name{font-size:.95em;font-weight:700;color:var(--text);}
.shop-card .price-row{display:flex;align-items:center;gap:4px;font-size:.85em;font-weight:700;color:var(--brand-dark);}
.shop-card .price-row svg{width:14px;height:14px;}
.shop-card .price-row.free{color:var(--brand);}
.shop-card .state-tag{position:absolute;top:10px;right:10px;font-size:.65em;font-weight:700;padding:4px 10px;border-radius:var(--radius-pill);}
.shop-card .state-tag.owned{background:var(--brand);color:#fff;}
.shop-card .state-tag.expired{background:var(--danger-bg);color:var(--danger);}
.shop-card .expire-text{font-size:.7em;color:var(--text-light);}

.preview-stage{display:flex;flex-direction:column;gap:16px;padding:24px 16px;margin:0 0 20px;background:var(--bg);border-radius:var(--radius-sm);}
.preview-stage .row{margin:0;display:flex;}
.preview-stage .row.other{justify-content:flex-start;}
.preview-stage .row.self{justify-content:flex-end;}
.preview-stage .bubble{padding:10px 16px;font-size:.95em;line-height:1.4;white-space:nowrap;}

.loading-state{text-align:center;color:var(--text-muted);padding:40px 0;font-size:.9em;grid-column:1/-1;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* 弹窗 */
.modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(17,24,39,.4);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-overlay.active{display:flex;}
.modal-box{background:var(--bg-surface);border-radius:var(--radius-lg);max-width:360px;width:100%;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,.1);text-align:center;animation:popIn .3s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box h3{font-size:1.2em;margin-bottom:12px;color:var(--text);font-weight:700;}
.modal-box p{font-size:.9em;color:var(--text-muted);line-height:1.6;margin-bottom:24px;}
.modal-box .mb-actions{display:flex;gap:12px;}
.modal-box .mb-actions button{flex:1;padding:14px;border-radius:var(--radius-pill);border:none;font-family:inherit;font-weight:600;font-size:.95em;cursor:pointer;transition:var(--transition-smooth);}
.modal-box .mb-actions button:active{transform:scale(.96);}
.modal-box .mb-cancel{background:var(--bg);color:var(--text-muted);}
.modal-box .mb-ok{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(132,204,22,0.3);}
.modal-box .mb-ok:disabled{opacity:.5;pointer-events:none;box-shadow:none;}
</style>
</head>
<body>
<div id="mainApp">
  <div class="app-header">
    <button class="back" onclick="history.back()"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <span class="title">皮肤商店</span>
    <div class="coin-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h5M9.5 14.5h5"/></svg><span id="coinNum">--</span></div>
  </div>
  <div class="shop-body">
    <div class="act-banner" id="actBanner"></div>
    <div class="shop-tabs">
      <button class="shop-tab active" data-tab="all" onclick="switchShopTab('all')">全部气泡</button>
      <button class="shop-tab" data-tab="owned" onclick="switchShopTab('owned')">已拥有</button>
    </div>
    <div class="shop-grid" id="shopGrid">
      <div class="shop-card"><div class="skeleton skeleton-line" style="height:60px;margin-bottom:12px;"></div><div class="skeleton skeleton-line short"></div></div>
      <div class="shop-card"><div class="skeleton skeleton-line" style="height:60px;margin-bottom:12px;"></div><div class="skeleton skeleton-line short"></div></div>
      <div class="shop-card"><div class="skeleton skeleton-line" style="height:60px;margin-bottom:12px;"></div><div class="skeleton skeleton-line short"></div></div>
      <div class="shop-card"><div class="skeleton skeleton-line" style="height:60px;margin-bottom:12px;"></div><div class="skeleton skeleton-line short"></div></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="buyModal">
  <div class="modal-box">
    <h3 id="buyTitle">皮肤预览</h3>
    <div class="preview-stage" id="previewStage"></div>
    <p id="buyDesc"></p>
    <div class="mb-actions">
      <button class="mb-cancel" onclick="closeBuy()">取消</button>
      <button class="mb-ok" id="buyOk">购买</button>
    </div>
  </div>
</div>

<script>
var SKINS = ["原版","经典圆角","暗夜霓虹","渐变紫","粉嫩","毛玻璃","新拟态","星空","烫金黑","手写便签","立体凸起","极光","莫兰迪","赛博绿","果冻","渐变描边","亚克力","暗金","泡泡渐变","樱桃红","黑白","微信绿","磨砂蓝","梦幻紫粉","霓虹白底","✨流光边框","✨呼吸发光","✨渐变流动","✨微微浮动","✨闪光掠过","✨果冻弹跳","✨星星闪烁","✨液态流动","✨霓虹脉冲","✨打字光标","🐱猫爪","🌸樱花","⭐星星","🐰兔耳","💗爱心","☁️云朵","🍀四叶草","🌙月亮","🎀蝴蝶结","🌈彩虹云"];

var currentUser = null;
var coinBalance = 0;
var currentSkin = 0;
var shopTab = 'all';
var prices = {};
var owned = {};
var buyingSkin = null;
var buyMode = 'buy';
var buySkinId = 0;

function getSessionUser(){ var s=localStorage.getItem('sq_user_session'); if(s){try{return JSON.parse(s)}catch(e){}} return null; }
function showToast(msg) { window.showCustomToast(msg); }
function fmtExpire(ms){ var d = new Date(ms); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }

async function init(){
  currentUser = getSessionUser();
  if(!currentUser){
    document.getElementById('shopGrid').innerHTML = '<div class="empty-state" style="grid-column:1/-1;text-align:center;padding:40px 0;color:var(--text-muted);font-size:0.9em;">请先登录后查看皮肤商店</div>';
    if(window.hideLoading) window.hideLoading();
    return;
  }
  try{
    var uq = await window.sb.rpc('get_my_profile');
    var ud = uq.data || {};
    coinBalance = ud.coins || 0;
    currentSkin = (typeof ud.bubble_skin === 'number') ? ud.bubble_skin : 0;
  }catch(e){ coinBalance = currentUser.coins || 0; }
  document.getElementById('coinNum').textContent = coinBalance;

  await Promise.all([loadPrices(), loadOwned(), loadActivities()]);
  if(window.hideLoading) window.hideLoading();
  renderGrid();
}

var discount = 0;

async function loadPrices(){
  try{
    var r = await window.sb.from('skin_prices').select('*');
    if(r.error) throw r.error;
    (r.data||[]).forEach(function(p){ prices[p.skin_id] = p; });
  }catch(e){ console.warn('loadPrices failed', e); }
}
async function loadOwned(){
  try{
    var r = await window.sb.from('skin_purchases').select('skin_id,expire_at').eq('user_id', currentUser.id);
    if(r.error) throw r.error;
    (r.data||[]).forEach(function(p){
      var ms = new Date(p.expire_at).getTime();
      if(!owned[p.skin_id] || ms > owned[p.skin_id]) owned[p.skin_id] = ms;
    });
  }catch(e){ console.warn('loadOwned failed', e); }
}
async function loadActivities(){
  try{
    var r = await window.sb.from('shop_activities').select('*').eq('active', true).order('created_at', {ascending:false});
    if(r.error) throw r.error;
    var now = Date.now();
    var list = r.data || [];
    var a = null;
    for(var k=0;k<list.length;k++){
      var it = list[k];
      if(it.start_at && new Date(it.start_at).getTime() > now) continue;
      if(it.end_at && new Date(it.end_at).getTime() < now) continue;
      a = it; break;
    }
    if(!a) return;
    discount = (a.discount > 0 && a.discount < 10) ? a.discount : 0;
    var banner = document.getElementById('actBanner');
    banner.innerHTML = '<div class="act-title">'+escapeHtml(a.title)+'</div>'+
      (a.description ? '<div class="act-desc">'+escapeHtml(a.description)+'</div>' : '')+
      (discount ? '<span class="act-off">限时 '+discount+' 折</span>' : '');
    banner.classList.add('show');
  }catch(e){ console.warn('loadActivities failed', e); }
}

function finalPrice(base){
  if(discount > 0 && discount < 10) return Math.max(1, Math.round(base * discount / 10));
  return base;
}

function switchShopTab(t){
  shopTab = t;
  document.querySelectorAll('.shop-tab').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === t); });
  renderGrid();
}
function renderGrid(){
  var grid = document.getElementById('shopGrid');
  var html = '';
  var now = Date.now();
  SKINS.forEach(function(name, i){
    var p = prices[i] || {price:100, duration_days:30};
    var isFree = (i === 0);
    var exp = owned[i];
    var isOwned = (isFree || (exp && exp > now));
    var isExpired = exp && exp <= now;
    var isInUse = (i === currentSkin);
    if(shopTab === 'owned' && !isOwned) return;
    var fp = finalPrice(p.price);
    var hasOff = fp < p.price;
    var priceLabel;
    if(isFree){
      priceLabel = '<span class="price-row free">免费</span>';
    } else if(hasOff){
      priceLabel = '<span class="price-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h5M9.5 14.5h5"/></svg><s style="opacity:.5;font-weight:600">'+p.price+'</s> '+fp+' 小七币</span>';
    } else {
      priceLabel = '<span class="price-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h5M9.5 14.5h5"/></svg>'+p.price+' 小七币</span>';
    }
    var tag = isInUse ? '<span class="state-tag inuse" style="background:#3B82F6;color:#fff">使用中</span>' : (isOwned ? '<span class="state-tag owned">已拥有</span>' : (isExpired ? '<span class="state-tag expired">已过期</span>' : ''));
    var expText = (isOwned && !isFree) ? '<span class="expire-text">有效期至 '+fmtExpire(exp)+'</span>' : '';
    var ph = 60 + (i % 4) * 16;
    html += '<div class="shop-card b'+i+' '+(isOwned?'owned':'')+' '+(isInUse?'inuse':'')+'" data-skin="'+i+'" onclick="onCardClick('+i+')">'+
      tag +
      '<div class="preview" style="min-height:'+ph+'px"><span class="row self"><span class="bubble">选择你的气泡</span></span></div>'+
      '<div class="info">'+
        '<div class="name">'+escapeHtml(name)+'</div>'+
        priceLabel + expText +
      '</div>'+
      '</div>';
  });
  grid.innerHTML = html;
}

function onCardClick(i){
  var now = Date.now();
  var exp = owned[i];
  var isFree = (i === 0);
  var isOwned = (isFree || (exp && exp > now));
  var isInUse = (i === currentSkin);
  var p = prices[i] || {price:100, duration_days:30};
  var fp = finalPrice(p.price);
  var canBuy = !isFree && !isOwned && coinBalance >= fp;

  buyingSkin = (isFree || isOwned) ? null : i;
  buyMode = isInUse ? 'inuse' : (isOwned ? 'equip' : 'buy');
  buySkinId = i;

  var stage = document.getElementById('previewStage');
  stage.className = 'preview-stage b'+i+' '+(isOwned?'self':'');
  stage.innerHTML =
    '<span class="row other"><span class="bubble">在吗？</span></span>' +
    '<span class="row self"><span class="bubble">你好呀</span></span>';

  document.getElementById('buyTitle').textContent = SKINS[i];

  var okBtn = document.getElementById('buyOk');
  var desc = document.getElementById('buyDesc');
  if(isInUse){
    desc.innerHTML = '当前使用中';
    okBtn.textContent = '使用中'; okBtn.disabled = true;
  } else if(isFree){
    desc.innerHTML = '原版皮肤，免费使用';
    okBtn.textContent = '使用原版'; okBtn.disabled = false;
  } else if(isOwned){
    desc.innerHTML = '已拥有该皮肤<br><span style="color:var(--text-light);font-size:.9em">有效期至 '+fmtExpire(exp)+'</span>';
    okBtn.textContent = '使用'; okBtn.disabled = false;
  } else {
    var priceHtml = fp < p.price
      ? '价格：<b>'+fp+' 小七币</b>（原价 <s>'+p.price+'</s>）'
      : '价格：<b>'+fp+' 小七币</b>';
    var warn = coinBalance < fp
      ? '<br><span style="color:var(--danger)">小七币不足，还差 '+(fp-coinBalance)+' 币</span>'
      : '<br>购买后余额：'+(coinBalance-fp)+' 币';
    desc.innerHTML = priceHtml+'<br>有效期：'+p.duration_days+' 天'+warn;
    okBtn.textContent = coinBalance < fp ? '余额不足' : '购买';
    okBtn.disabled = !canBuy;
  }

  document.getElementById('buyModal').classList.add('active');
}
function closeBuy(){ document.getElementById('buyModal').classList.remove('active'); buyingSkin=null; }

document.getElementById('buyOk').addEventListener('click', async function(){
  var i = buySkinId;
  if(buyMode === 'equip'){
    this.disabled = true; this.textContent = '处理中…';
    try{
      var er = await window.sb.rpc('equip_skin', { p_skin_id: i });
      if(er.error) throw er.error;
      var eres = er.data || {};
      if(!eres.ok) throw new Error(eres.message || '切换失败');
      currentSkin = i;
      currentUser.bubble_skin = i;
      setSessionUser(currentUser);
      closeBuy(); renderGrid();
      showToast('已切换为「'+SKINS[i]+'」');
    }catch(e){ showToast('切换失败：'+(e.message||e)); }
    finally{ this.disabled = false; }
    return;
  }
  if(buyingSkin === null){ closeBuy(); return; }
  this.disabled = true; this.textContent = '处理中…';
  try{
    // ★ 核心安全：通过 RPC 购买，防并发扣费漏洞
    var r = await window.sb.rpc('buy_skin', { p_skin_id: i });
    if(r.error) throw r.error;
    var res = r.data || {};
    if(!res.ok) throw new Error(res.message || '购买失败');
    coinBalance = res.balance;
    owned[i] = new Date(res.expire_at).getTime();
    if(typeof res.bubble_skin === 'number') currentSkin = res.bubble_skin;
    currentUser.bubble_skin = currentSkin;
    document.getElementById('coinNum').textContent = coinBalance;
    currentUser.coins = coinBalance;
    setSessionUser(currentUser);
    closeBuy();
    renderGrid();
    showToast('购买成功！「'+SKINS[i]+'」已解锁');
  }catch(e){
    showToast('购买失败：'+(e.message||e));
  }finally{
    this.disabled = false; this.textContent = '确认购买';
  }
});

init();
</script>
</body>
</html>
