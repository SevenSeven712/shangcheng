<style>
/* 1. 开屏动画（白底黑字，每天首次打开显示） */
#bootScreen { position: fixed; inset: 0; z-index: 99999; background: #ffffff; display: flex; align-items: center; justify-content: center; transition: opacity 0.6s ease; opacity: 1; }
#bootScreen.hide { opacity: 0; pointer-events: none; }
.loader-wrapper { position: relative; display: flex; align-items: center; justify-content: center; height: 120px; width: auto; font-family: "Poppins", sans-serif; font-size: 1.6em; font-weight: 600; user-select: none; color: #000000; scale: 2; }
.loader { position: absolute; top: 0; left: 0; height: 100%; width: 100%; z-index: 1; background-color: transparent; mask: repeating-linear-gradient(90deg, transparent 0, transparent 6px, black 7px, black 8px); }
.loader::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(circle at 50% 50%, #ff0 0%, transparent 50%), radial-gradient(circle at 45% 45%, #f00 0%, transparent 45%), radial-gradient(circle at 55% 55%, #0ff 0%, transparent 45%), radial-gradient(circle at 45% 55%, #0f0 0%, transparent 45%), radial-gradient(circle at 55% 45%, #00f 0%, transparent 45%); mask: radial-gradient(circle at 50% 50%, transparent 0%, transparent 10%, black 25%); animation: transform-animation 2s infinite alternate, opacity-animation 4s infinite; animation-timing-function: cubic-bezier(0.6, 0.8, 0.5, 1); }
@keyframes transform-animation { 0% { transform: translate(-55%); } 100% { transform: translate(55%); } }
@keyframes opacity-animation { 0%, 100% { opacity: 0; } 15% { opacity: 1; } 65% { opacity: 0; } }
.loader-letter { display: inline-block; opacity: 0; animation: loader-letter-anim 4s infinite linear; z-index: 2; }
.loader-letter:nth-child(1) { animation-delay: 0.1s; }
.loader-letter:nth-child(2) { animation-delay: 0.205s; }
.loader-letter:nth-child(3) { animation-delay: 0.31s; }
.loader-letter:nth-child(4) { animation-delay: 0.415s; }
.loader-letter:nth-child(5) { animation-delay: 0.521s; }
.loader-letter:nth-child(6) { animation-delay: 0.626s; }
.loader-letter:nth-child(7) { animation-delay: 0.731s; }
.loader-letter:nth-child(8) { animation-delay: 0.837s; }
@keyframes loader-letter-anim { 0% { opacity: 0; } 5% { opacity: 1; text-shadow: 0 0 4px #000; transform: scale(1.1) translateY(-2px); } 20% { opacity: 0.2; } 100% { opacity: 0; } }

/* 2. 引导页 */
#introScreen { position: fixed; inset: 0; z-index: 9000; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; opacity: 1; overflow: hidden; }
#introScreen.hide { opacity: 0; pointer-events: none; }
.intro-orb { position: absolute; border-radius: 50%; filter: blur(80px); z-index: 1; opacity: 0.5; animation: floatOrb 8s ease-in-out infinite alternate; }
.orb1 { width: 350px; height: 350px; background: var(--brand-light); top: -100px; left: -100px; }
.orb2 { width: 450px; height: 450px; background: rgba(132,204,22,0.15); bottom: -150px; right: -100px; animation-delay: -4s; }
@keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 30px) scale(1.1); } }
.slides-wrap { position: relative; z-index: 2; width: 100%; max-width: 400px; height: 440px; display: flex; align-items: center; justify-content: center; }
.intro-slide { display: none; text-align: center; padding: 20px; width: 100%; }
.intro-slide.active { display: block; }
.intro-slide .anim-item { opacity: 0; }
.intro-slide.active .anim-item { animation: slideUpFade 0.6s cubic-bezier(0.4, 0, 0.2, 1) both; }
.intro-slide.active .delay-1 { animation-delay: 0.1s; }
.intro-slide.active .delay-2 { animation-delay: 0.2s; }
.intro-slide.active .delay-3 { animation-delay: 0.3s; }
@keyframes slideUpFade { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
.intro-icon { width: 100px; height: 100px; border-radius: 28px; margin: 0 auto 32px; display: flex; align-items: center; justify-content: center; background: #fff; box-shadow: var(--shadow-md); border: 1px solid var(--border); }
.intro-icon svg { width: 48px; height: 48px; filter: drop-shadow(0 4px 8px rgba(132,204,22,0.2)); }
.intro-title { font-size: 1.8em; font-weight: 700; margin-bottom: 16px; color: var(--text); letter-spacing: -0.5px; }
.intro-desc { font-size: 1em; color: var(--text-muted); line-height: 1.6; font-weight: 500; }
.intro-footer { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; margin-top: 20px; }
.intro-dots { display: flex; gap: 8px; margin-bottom: 32px; }
.intro-dots .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-subtle); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.intro-dots .dot.active { width: 24px; border-radius: 4px; background: var(--brand); }
.intro-btn { background: var(--brand); color: #fff; border: none; padding: 16px 48px; font-size: 1.05em; font-weight: 600; border-radius: var(--radius-pill); cursor: pointer; min-width: 220px; box-shadow: 0 8px 24px rgba(132,204,22,0.3); transition: all 0.3s; }
.intro-btn:hover { background: var(--brand-light); transform: translateY(-2px); box-shadow: 0 12px 28px rgba(132,204,22,0.4); }
.intro-btn:active { transform: scale(0.96); }
.skip-btn { background: none; border: none; color: var(--text-muted); font-size: 0.9em; margin-top: 20px; cursor: pointer; font-weight: 500; transition: color 0.2s; }
.skip-btn:hover { color: var(--brand); }

/* 3. 登录/注册层 */
#authScreen { position: fixed; inset: 0; z-index: 8000; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 20px; background-image: radial-gradient(circle at 20% 10%, rgba(132, 204, 22, 0.08) 0%, transparent 40%), radial-gradient(circle at 80% 90%, rgba(132, 204, 22, 0.06) 0%, transparent 45%); transition: opacity 0.4s ease; opacity: 1; overflow-y: auto; }
#authScreen.hide { opacity: 0; pointer-events: none; }
.login-card { width: 100%; max-width: 400px; background: var(--bg-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: var(--radius-lg); padding: 36px 32px; border: 1px solid var(--border); box-shadow: 0 24px 64px rgba(0,0,0,0.04); }
.login-header { display: flex; justify-content: center; align-items: center; margin-bottom: 24px; }
.login-logo { font-weight: 800; font-size: 1.6em; color: var(--text); display: flex; align-items: center; gap: 0.2em; }
.login-logo span { color: var(--brand); }
.login-title { font-size: 1.2em; font-weight: 600; text-align: center; margin-bottom: 24px; color: var(--text); }
.login-title span { display: block; font-weight: 500; color: var(--text-muted); font-size: 0.75em; margin-top: 6px; }
.login-form { display: flex; flex-direction: column; gap: 16px; }
.field-group { display: flex; flex-direction: column; gap: 8px; }
.field-group label { font-size: 0.85em; font-weight: 600; color: var(--text-muted); }
.field-group input { width: 100%; padding: 14px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); background: var(--bg-surface); font-size: 0.95em; outline: none; transition: all 0.3s; color: var(--text); }
.field-group input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-bg); }
.login-continue { width: 100%; padding: 14px; border-radius: var(--radius-sm); border: none; background: var(--brand); color: #fff; font-weight: 600; font-size: 1em; cursor: pointer; margin-top: 8px; transition: all 0.3s; box-shadow: 0 4px 12px rgba(132,204,22,0.25); }
.login-continue:hover { background: var(--brand-light); transform: translateY(-1px); }
.login-continue:active { transform: scale(0.98); }
.login-footer { text-align: center; margin-top: 20px; font-size: 0.9em; color: var(--text-muted); }
.login-footer .switch-link { color: var(--brand); font-weight: 600; cursor: pointer; border: none; background: none; padding: 0 4px; text-decoration: none; transition: color 0.2s; }
.login-footer .switch-link:hover { color: var(--brand-dark); text-decoration: underline; }
.login-error { color: var(--danger); font-size: 0.85em; text-align: center; min-height: 20px; margin-top: 4px; line-height: 1.4; }
.auth-card { display: none; }
.auth-card.active { display: block; animation: slideUpFade 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
.field-hint { font-size: 0.75em; margin-top: 6px; min-height: 1.2em; transition: color 0.2s; font-weight: 500; }
.field-hint.error { color: var(--danger); }
.field-hint.success { color: var(--brand); }
</style>


<script src="./common.js"></script>

<script>
var SUPABASE_URL = "https://bdflblooezmhgawkzhkv.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_mQbWq3yUoa8U5fmlk61WnA_W_rsrqCL";
if (!window.sb && window.supabase) window.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var DOMESTIC_EMAIL_REGEX = /^[a-zA-Z0-9_.-]+@(qq|vip\.qq|foxmail|163|126|yeah|sina|sohu|139|189|aliyun)\.(com|cn|net)$/i;

async function fetchMyProfileServer() {
    if (!window.sb) return null;
    try { var r = await window.sb.rpc('get_my_profile'); if (!r.error && r.data) return Array.isArray(r.data) ? r.data[0] : r.data; } catch (e) {}
    return null;
}

async function ensureProfileFromAuth(nickname) {
    if (!window.sb) return null;
    try {
        var s = await window.sb.auth.getUser();
        var me = s && s.data && s.data.user;
        if (!me) return null;
        var nick = nickname || (me.user_metadata && me.user_metadata.nickname) || (me.email || '').split('@')[0];
        var ip = '0.0.0.0';
        try { var res = await fetch('https://api.ipify.org?format=json'); ip = (await res.json()).ip; } catch(e) {}
        var r = await window.sb.rpc('register_profile', { p_nickname: nick, p_ip: ip, p_uid: null });
        if (!r.error) return await fetchMyProfileServer();
        var ins = await window.sb.from('users').insert([{ id: me.id, nickname: nick, ip_address: ip }]).select();
        if (!ins.error && ins.data[0]) return ins.data[0];
        return await fetchMyProfileServer();
    } catch (e) { return null; }
}

function saveLocalSession(profile) {
    if (!profile) return;
    var o = {}; ['id', 'nickname', 'avatar_url', 'is_admin', 'coins', 'banned_until'].forEach(k => { if (profile[k] !== undefined) o[k] = profile[k]; });
    localStorage.setItem('sq_user_session', JSON.stringify(o));
}

async function doLogin() {
    if (!window.sb) return alert('网络组件未加载完毕');
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    var errEl = document.getElementById('loginError');
    if (!email || !password) return errEl.textContent = '请填写邮箱和密码';
    errEl.textContent = '登录中...';
    try {
        var res = await window.sb.auth.signInWithPassword({ email, password });
        if (res.error) throw new Error('账号或密码错误');
        var profile = await fetchMyProfileServer() || await ensureProfileFromAuth();
        if (!profile) throw new Error('档案补建失败');
        // 安全验证已交由数据库 RLS 处理，无需二次前端验证
        saveLocalSession(profile);
        document.getElementById('authScreen').classList.add('hide');
        setTimeout(() => window.location.href = './posts.html', 400);
    } catch (e) { errEl.textContent = e.message; }
}

async function doRegister() {
    if (!window.sb) return alert('网络组件未加载完毕');
    var nickname = document.getElementById('regNick').value.trim();
    var email = document.getElementById('regEmail').value.trim();
    var pwd = document.getElementById('regPassword').value;
    var pwd2 = document.getElementById('regPassword2').value;
    var errEl = document.getElementById('registerError');
    if (!nickname || !email || !pwd) return errEl.textContent = '请填写完整信息';
    if (!DOMESTIC_EMAIL_REGEX.test(email)) return errEl.textContent = '仅支持 QQ、163、126 等国内常用邮箱';
    if (pwd !== pwd2) return errEl.textContent = '两次密码不一致';
    errEl.textContent = '注册中...';
    try {
        var res = await window.sb.auth.signUp({ email, password: pwd, options: { data: { nickname: nickname } } });
        if (res.error) {
            var msg = res.error.message;
            if (msg.includes('rate limit') || msg.includes('Email rate limit exceeded')) { errEl.innerHTML = '⚠️ <b>今日邮箱发送数量已达上限</b><br>请直接添加 <b>站主QQ：2103686588</b> 为您补号。'; return; }
            if (msg.includes('already registered')) throw new Error('该邮箱已注册');
            throw new Error(msg);
        }
        if (!res.data.session) {
            // 显示验证码输入区，隐藏注册表单上半部分
            document.getElementById('registerBtn').style.display = 'none';
            document.getElementById('otpVerifyArea').style.display = 'block';
            window.tempRegEmail = email;
            localStorage.setItem('sq_temp_reg_email', email);
            window.tempRegNick = nickname;
            errEl.innerHTML = '✅ 验证码已发送，请查看邮箱（含垃圾箱）';
            errEl.style.color = 'var(--brand)';
            return;
        }
        await ensureProfileFromAuth(nickname);
        document.getElementById('authScreen').classList.add('hide');
        setTimeout(() => window.location.href = './posts.html', 400);
    } catch (e) { errEl.textContent = e.message; }
}

function switchCard(which) {
    ['loginCard', 'registerCard'].forEach(function (id) { var el = document.getElementById(id); if (el) el.classList.toggle('active', id === which + 'Card'); });
    document.getElementById('loginError').textContent = ''; document.getElementById('registerError').textContent = '';
    if (which === 'login') document.getElementById('regEmailHint').textContent = '';
}

(function init() {
    // 判断是否每天首次访问
    var today = new Date().toDateString();
    var lastVisit = localStorage.getItem('sq_last_visit_date');
    var bootScreen = document.getElementById('bootScreen');

    if (lastVisit === today) {
        bootScreen.style.display = 'none';
        checkAuth();
    } else {
        localStorage.setItem('sq_last_visit_date', today);
        setTimeout(function() {
            bootScreen.classList.add('hide');
            setTimeout(function() { bootScreen.style.display = 'none'; checkAuth(); }, 600);
        }, 2500);
    }

    function checkAuth() {
        document.getElementById('toRegisterBtn').onclick = function() { switchCard('register'); };
        document.getElementById('toLoginBtn').onclick = function() { switchCard('login'); };
        document.getElementById('loginBtn').onclick = doLogin;
        document.getElementById('registerBtn').onclick = doRegister;

    document.getElementById('verifyBtn').onclick = async function() {
        if (this.disabled) return; // 防连点拦截
        var rawOtp = document.getElementById('regOtp').value;
        var otp = rawOtp.replace(/\D/g, ''); 
        var err = document.getElementById('verifyError');
        
        if (otp.length < 6) return err.textContent = '请输入正确的数字验证码';
        
        var targetEmail = (window.tempRegEmail || localStorage.getItem('sq_temp_reg_email') || '').trim().toLowerCase();
        if (!targetEmail) return err.textContent = '邮箱信息丢失，请刷新页面重新注册';
        
        this.disabled = true; 
        this.textContent = '验证中...';
        err.textContent = '';
        
        try {
            console.log("【单次验证请求】邮箱:", targetEmail, "验证码:", otp);
            var res = await window.sb.auth.verifyOtp({
                email: targetEmail,
                token: otp,
                type: 'signup'
            });
            
            if (res.error) throw res.error;
            
            await ensureProfileFromAuth(window.tempRegNick || '新用户');
            localStorage.removeItem('sq_temp_reg_email');
            document.getElementById('authScreen').classList.add('hide');
            setTimeout(() => window.location.href = './posts.html', 400);
            
        } catch(e) {
            console.error("【验证失败】", e);
            err.textContent = '验证失败：' + e.message;
            this.disabled = false; 
            this.textContent = '提交验证';
        }
    };

        document.getElementById('loginPassword').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
        document.getElementById('regPassword2').addEventListener('keydown', function(e) { if (e.key === 'Enter') doRegister(); });
        document.getElementById('regEmail').addEventListener('input', function() {
            var val = this.value.trim(); var hint = document.getElementById('regEmailHint');
            if (!val) { hint.textContent = ''; hint.className = 'field-hint'; return; }
            if (DOMESTIC_EMAIL_REGEX.test(val)) { hint.textContent = '✅ 邮箱格式正确'; hint.className = 'field-hint success'; }
            else { hint.textContent = '❌ 仅支持 QQ、163、126 等国内邮箱'; hint.className = 'field-hint error'; }
        });

        var currentSlide = 0, totalSlides = 4;
        function updateSlide(idx) {
            currentSlide = idx;
            document.querySelectorAll('.intro-slide').forEach(function(el, i) { el.classList.toggle('active', i === idx); });
            document.querySelectorAll('.intro-dots .dot').forEach(function(el, i) { el.classList.toggle('active', i === idx); });
            document.getElementById('introNextBtn').textContent = idx === totalSlides - 1 ? '开启体验' : '下一步';
        }
        document.getElementById('introNextBtn').onclick = function() { if (currentSlide < totalSlides - 1) updateSlide(currentSlide + 1); else finishIntro(); };
        document.getElementById('introSkipBtn').onclick = finishIntro;
        function finishIntro() {
            localStorage.setItem('seven_intro_shown_v6', '1');
            document.getElementById('introScreen').classList.add('hide');
            setTimeout(function() { document.getElementById('introScreen').style.display = 'none'; window.location.href = './messages.html'; }, 400);
        }

        if (window.sb) {
            window.sb.auth.getSession().then(function(s) {
                if (s.data && s.data.session) return fetchMyProfileServer().then(function(p) { return p || ensureProfileFromAuth(); });
                return null;
            }).then(function(profile) {
                if (profile) { saveLocalSession(profile); window.location.replace('./posts.html'); return; }
                var urlParams = new URLSearchParams(location.search);
                var isLoginIntent = urlParams.get('login') === '1';
                var hasSeenIntro = localStorage.getItem('seven_intro_shown_v6');
                var isReferrerInternal = document.referrer && document.referrer.includes(window.location.host);
                if (isLoginIntent || isReferrerInternal) document.getElementById('authScreen').style.display = 'flex';
                else if (!hasSeenIntro) document.getElementById('introScreen').style.display = 'flex';
                else window.location.replace('./messages.html');
            }).catch(function() {
                if (document.getElementById('introScreen').style.display !== 'flex' && document.getElementById('authScreen').style.display !== 'flex') document.getElementById('introScreen').style.display = 'flex';
            });
        } else {
            setTimeout(function(){ if (document.getElementById('introScreen').style.display !== 'flex' && document.getElementById('authScreen').style.display !== 'flex') document.getElementById('introScreen').style.display = 'flex'; }, 1500);
        }
    }
})();
</script>
</body>
</html>
