<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#65A30D" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>我的资产 · Seven戚</title>
<link rel="stylesheet" href="./theme.css" />
<script src="./vendor/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>');</script>
<script src="common.js"></script>
<style>
.app-header .back{background:none;border:none;cursor:pointer;color:var(--text);display:flex;padding:4px;border-radius:8px;transition:var(--transition-smooth);}
.app-header .back:hover{background:var(--border);}
.app-header .back svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.app-header .title{font-weight:700;font-size:1.05em;}

.asset-body{flex:1;overflow-y:auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom));}
.balance-card{
  background: linear-gradient(135deg, var(--brand-light), var(--brand));
  border-radius: var(--radius-lg);padding:32px 24px;color:#fff;text-align:center;
  box-shadow: 0 12px 32px rgba(132,204,22,0.3);position:relative;overflow:hidden;
}
.balance-card::after{content:"";position:absolute;top:-40%;right:-20%;width:200px;height:200px;background:rgba(255,255,255,.2);border-radius:50%;filter:blur(20px);}
.balance-card .bc-label{font-size:.85em;opacity:.9;font-weight:600;letter-spacing:.05em;position:relative;z-index:1;}
.balance-card .bc-num{font-size:3em;font-weight:700;margin:12px 0 8px;line-height:1;position:relative;z-index:1;}
.balance-card .bc-num small{font-size:.35em;font-weight:600;opacity:.9;margin-left:8px;}
.balance-card .bc-coin{font-size:.8em;opacity:.85;position:relative;z-index:1;}

.section-title{font-size:.8em;font-weight:600;color:var(--text-muted);margin:28px 0 12px 4px;}
.tx-list{display:flex;flex-direction:column;gap:10px;}
.tx-item{
  background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:var(--shadow-sm);transition:var(--transition-smooth);
}
.tx-item:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.tx-item .tx-info{min-width:0;flex:1;}
.tx-item .tx-reason{font-size:.95em;font-weight:600;color:var(--text);word-break:break-word;}
.tx-item .tx-time{font-size:.75em;color:var(--text-light);margin-top:4px;}
.tx-item .tx-amount{font-size:1.15em;font-weight:700;white-space:nowrap;}
.tx-item .tx-amount.plus{color:var(--brand);}
.tx-item .tx-amount.minus{color:var(--danger);}

.empty{text-align:center;color:var(--text-muted);padding:50px 20px;font-size:.9em;}
.empty svg{width:48px;height:48px;stroke:var(--text-light);fill:none;stroke-width:1.5;margin-bottom:12px;}

.refresh-btn{
  display:flex;align-items:center;justify-content:center;width:100%;margin-top:24px;padding:12px;
  border-radius:var(--radius-pill);border:1px solid var(--border-subtle);background:var(--bg-surface);
  color:var(--text-muted);font-weight:600;font-size:.9em;cursor:pointer;font-family:inherit;
  transition:var(--transition-smooth);box-shadow:var(--shadow-sm);
}
.refresh-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-bg);box-shadow:var(--shadow-md);}
.refresh-btn:active{transform:scale(.98);}

#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--radius-pill);font-size:.85em;font-weight:500;opacity:0;transition:var(--transition-smooth);z-index:9999;pointer-events:none;box-shadow:var(--shadow-md);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-10px)}
</style>
</head>
<body>
<div id="mainApp">
  <div class="app-header">
    <button class="back" onclick="history.back()"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <span class="title">我的资产</span>
    <div style="width:32px;"></div>
  </div>
  <div class="asset-body">
    <div class="balance-card">
      <div class="bc-label">小七币余额</div>
      <div class="bc-num" id="balanceNum">--<small>币</small></div>
      <div class="bc-coin">Seven戚 · 通行货币</div>
    </div>
    <div class="section-title">最近账单（最多 20 条）</div>
    <div class="tx-list" id="txList">
      <div class="empty"><svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg><div>加载中…</div></div>
    </div>
    <button class="refresh-btn" id="refreshBtn">刷新</button>
  </div>
</div>
<div id="toast"></div>
<script>
(function(){
  var currentUser = getSessionUser();
  if (!currentUser || !currentUser.id) { window.location.href = './index.html'; return; }

  function fmtTime(t){
    var d = new Date(t);
    var now = new Date();
    var diff = (now - d) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff/60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff/3600) + ' 小时前';
    return d.toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  }

  async function loadBalance(){
    try {
      var r = await window.sb.rpc('get_my_profile');
      var c = (r.data && r.data.coins) || 0;
      document.getElementById('balanceNum').innerHTML = c + '<small>币</small>';
      currentUser.coins = c;
      setSessionUser(currentUser);
    } catch(e){
      document.getElementById('balanceNum').innerHTML = '--<small>币</small>';
    }
  }

  async function loadTx(){
    var list = document.getElementById('txList');
    try {
      var r = await window.sb.from('coin_transactions')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false })
        .limit(20);
      if (r.error) throw r.error;
      var rows = r.data || [];
      if (!rows.length){
        list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 10h8M8 14h5"/></svg><div>还没有任何收支记录</div></div>';
        return;
      }
      list.innerHTML = rows.map(function(t){
        var plus = t.amount >= 0;
        return '<div class="tx-item">' +
          '<div class="tx-info">' +
            '<div class="tx-reason">' + escapeHtml(t.reason || '系统调整') + '</div>' +
            '<div class="tx-time">' + fmtTime(t.created_at) + '</div>' +
          '</div>' +
          '<div class="tx-amount ' + (plus ? 'plus' : 'minus') + '">' + (plus ? '+' : '') + t.amount + '</div>' +
        '</div>';
      }).join('');
    } catch(e){
      list.innerHTML = '<div class="empty"><div>账单加载失败：' + escapeHtml(e.message) + '</div></div>';
    }
  }

  async function refreshAll(){
    if(window.showLoading) window.showLoading();
    try { await loadBalance(); await loadTx(); } finally { if(window.hideLoading) window.hideLoading(); }
  }

  document.getElementById('refreshBtn').onclick = function(){ 
    var t = document.getElementById('toast');
    t.textContent = '已刷新'; t.classList.add('show');
    clearTimeout(window.tt); window.tt = setTimeout(()=>t.classList.remove('show'), 2000);
    refreshAll(); 
  };
  refreshAll();
  setTimeout(() => { if(window.hideLoading) window.hideLoading(); }, 5000);
})();
</script>
</body>
</html>
