<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#65A30D" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Seven戚 · 帖子广场</title>
<link rel="stylesheet" href="./theme.css" />
<script src="./vendor/supabase.js"></script>
<script src="./vendor/purify.min.js"></script>
<style>
.banned-banner{flex-shrink:0;background:var(--danger-bg);color:var(--danger);padding:8px 16px;font-size:0.8em;font-weight:600;text-align:center;border-bottom:1px solid #FECACA;display:none;}
.banned-banner.active{display:block}
.app-content{flex:1;min-height:0;overflow-y:auto;padding:20px 16px;}

.posts-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.posts-header .left{display:flex;gap:8px;align-items:center;overflow-x:auto;max-width:100%;scrollbar-width:none;}
.posts-header .left::-webkit-scrollbar{display:none}
.category-btn{padding:6px 16px;border-radius:var(--radius-pill);border:1px solid var(--border-subtle);background:var(--bg-surface);color:var(--text-muted);font-size:0.8em;font-weight:600;cursor:pointer;white-space:nowrap;transition:var(--transition-smooth);}
.category-btn.active{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(132,204,22,0.3);}
.new-post-btn{padding:8px 20px;border-radius:var(--radius-pill);border:none;background:var(--brand);color:#fff;font-weight:600;font-size:0.85em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:var(--transition-smooth);}
.new-post-btn:hover{background:var(--brand-light);transform:translateY(-1px)}
.floating-post-btn{position:fixed;bottom:90px;right:20px;z-index:1000;width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;border:none;box-shadow:0 8px 24px rgba(132,204,22,0.4);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;transition:var(--transition-smooth);font-size:2em;font-weight:300;line-height:1;}
.floating-post-btn:hover{transform:translateY(-4px) scale(1.05);background:var(--brand-light);}

.post-card{background:var(--bg-surface);border-radius:var(--radius-md);padding:16px;margin-bottom:12px;border:1px solid var(--border);cursor:pointer;box-shadow:var(--shadow-sm);transition:var(--transition-smooth);}
.post-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.post-card .post-author{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.post-card .post-author .avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;color:var(--brand-dark);background:var(--brand-bg);background-size:cover;background-position:center;}
.post-card .post-author .name{font-weight:600;font-size:.95em;color:var(--text);}
.post-card .post-author .official-tag{ background:#EFF6FF; color:#2563EB; font-size:.6em; padding:2px 8px; border-radius:var(--radius-pill); font-weight:600; border:1px solid #BFDBFE; }
.post-card .post-author .category-tag{background:var(--bg);color:var(--text-muted);font-size:.65em;font-weight:600;padding:2px 8px;border-radius:var(--radius-pill);border:1px solid var(--border);}
.post-card .post-author .time{font-size:.75em;color:var(--text-light);margin-left:auto;}
.post-card .post-title{font-weight:700;font-size:1.05em;margin:4px 0 6px 0;color:var(--text);}
.post-card .post-content{font-size:.88em;color:var(--text-muted);line-height:1.6;margin-bottom:10px;word-break:break-word;}
.post-card .post-content img{max-width:100%;border-radius:var(--radius-sm);margin:8px 0}
.post-card .post-content.clamped{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.post-card .post-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;border-top:1px solid var(--border);padding-top:12px;}
.post-card .like-btn{background:none;border:none;display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:.85em;font-weight:600;cursor:pointer;padding:4px 8px;border-radius:8px;transition:var(--transition-smooth);}
.post-card .like-btn:hover{background:var(--bg);}
.post-card .like-btn.liked{color:#EF4444;}
.post-card .like-btn.liked svg{fill:#EF4444;}
.post-card .comment-count{font-size:.8em;color:var(--text-light);display:flex;align-items:center;gap:4px;}

.empty-state{text-align:center;color:var(--text-muted);padding:40px 20px;font-size:.9em}
.loading-state{text-align:center;padding:40px 20px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

.detail-overlay{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:999}
.detail-overlay.active{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.detail-header{display:flex;align-items:center;padding:12px 16px;background:var(--bg-glass);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;position:sticky;top:0;z-index:10;}
.detail-header .back-btn{background:none;border:none;cursor:pointer;padding:6px;color:var(--text);display:flex;border-radius:8px;}
.detail-header .back-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.detail-content{flex:1;overflow-y:auto;padding:20px 16px}
.detail-post{background:var(--bg-surface);border-radius:var(--radius-md);padding:20px;margin-bottom:20px;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
.detail-post .post-author{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.detail-post .post-author .avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:16px;color:var(--brand-dark);background:var(--brand-bg);background-size:cover;background-position:center;}
.detail-post .post-author .name{font-weight:600;font-size:1em;color:var(--text);}
.detail-post .post-author .time{font-size:.8em;color:var(--text-light);margin-left:auto;}
.detail-post .post-title{font-weight:700;font-size:1.2em;margin:8px 0 12px 0;color:var(--text);}
.detail-post .post-content{font-size:1em;color:var(--text);line-height:1.7;word-break:break-word;}

.detail-comments{flex:1;margin-top:12px;display:flex;flex-direction:column;background:var(--bg-surface);border-radius:var(--radius-md);border:1px solid var(--border);padding:0 16px;box-shadow:var(--shadow-sm);}
.comment-item{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--border-subtle);}
.comment-item:last-child{border-bottom:none;}
.comment-item .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--brand-dark);background:var(--brand-bg);background-size:cover;background-position:center;}
.comment-item .body{flex:1}
.comment-item .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.comment-item .meta .name{font-weight:600;font-size:.9em;color:var(--text-muted);}
.comment-item .meta .time{font-size:.7em;color:var(--text-light)}
.comment-item .txt{font-size:.9em;line-height:1.6;color:var(--text);margin-top:4px;}

.detail-input-area{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg-surface);border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;z-index:10;}
.detail-input-area input{flex:1;padding:12px 16px;border-radius:var(--radius-pill);border:1px solid var(--border-subtle);background:var(--bg);font-family:inherit;font-size:.9em;outline:none;}
.detail-input-area button{padding:12px 24px;border-radius:var(--radius-pill);border:none;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
<div id="mainApp">
<div id="header-container"></div>
<div class="banned-banner" id="bannedBanner">账号已被封禁，无法发布新帖或评论。解封时间：<span id="bannedUntilDisplay"></span></div>
<div class="app-content" id="postContent">
  <div class="posts-header">
    <div class="left" id="categoryFilter"></div>
    <div style="display:flex;gap:8px;">
      <button class="new-post-btn" id="adminPanelBtn" style="display:none;background:#64748B;color:#fff;box-shadow:0 2px 8px rgba(100,116,139,0.25);">管理</button>
      <a href="./new-post.html" class="new-post-btn">发帖</a>
    </div>
  </div>
  <div id="postList"></div>
</div>
<div id="footer-container"></div>
</div>

<a href="./new-post.html" class="floating-post-btn">＋</a>

<div class="detail-overlay" id="detailOverlay">
  <div style="display:flex;flex-direction:column;height:100%;">
    <div class="detail-header">
      <button class="back-btn" id="closeDetail"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
      <span style="font-weight:700;font-size:1.05em;">帖子详情</span>
    </div>
    <div class="detail-content" id="detailContent"></div>
    <div class="detail-input-area">
      <input type="text" id="detailCommentInput" placeholder="写评论…" maxlength="200" />
      <button id="detailSendCommentBtn">发送</button>
    </div>
  </div>
</div>

<script src="./common.js"></script>
<script>
var currentUser = getSessionUser();
if (!currentUser || !currentUser.id) window.location.href = './index.html';
var isAdmin = currentUser.is_admin === true;

if (isAdmin) document.getElementById('adminPanelBtn').style.display = 'inline-flex';
document.getElementById('adminPanelBtn').onclick = function() { window.location.href = './admin.html'; };
renderHeader('帖子广场', 'posts');
renderFooter('posts');

var categories = [], posts = [], currentCategory = '全部';

async function loadAll() {
    setTimeout(function() { if (window.hidePageLoading) window.hidePageLoading(); }, 2000);
    try {
        document.getElementById('postList').innerHTML = '<div class="skeleton-card"><div class="skeleton-header"><div class="skeleton skeleton-avatar"></div><div class="skeleton skeleton-title"></div></div><div class="skeleton skeleton-line" style="width:80%;margin-top:8px;"></div></div>';
        
        const [r1, r2, r3, r4, r5] = await Promise.all([
            window.sb.from('categories').select('*').order('sort_order'),
            window.sb.from('posts').select('*').order('created_at', { ascending: false }),
            window.sb.from('users').select('id, nickname, avatar_url'),
            window.sb.from('post_likes').select('post_id, user_id'),
            window.sb.from('post_comments').select('id, post_id')
        ]);

        categories = r1.data || [];
        const rawPosts = r2.data || [];
        const allUsers = r3.data || [];
        const allLikes = r4.data || [];
        const allComments = r5.data || [];

        const userMap = {};
        allUsers.forEach(u => userMap[u.id] = u);

        const likesMap = {};
        allLikes.forEach(l => {
            if (!likesMap[l.post_id]) likesMap[l.post_id] = [];
            likesMap[l.post_id].push(l);
        });

        const commentsMap = {};
        allComments.forEach(c => {
            if (!commentsMap[c.post_id]) commentsMap[c.post_id] = [];
            commentsMap[c.post_id].push(c);
        });

        posts = rawPosts.map(p => ({
            ...p,
            users: userMap[p.user_id] || null,
            post_likes: likesMap[p.id] || [],
            post_comments: commentsMap[p.id] || []
        }));
        
        renderCategoryFilter();
        renderPosts();
    } catch (e) { 
        console.error(e);
        document.getElementById('postList').innerHTML = '<div class="empty-state">数据加载异常：' + e.message + '</div>'; 
    } finally {
        if (window.hidePageLoading) window.hidePageLoading();
    }
}

function renderCategoryFilter() {
    var container = document.getElementById('categoryFilter');
    var html = '<button class="category-btn active" data-cat="全部">全部</button>';
    categories.filter(function(x) { return x.name !== '未分类' && (!x.is_admin_only || isAdmin); }).forEach(function(x) {
        html += '<button class="category-btn" data-cat="' + x.id + '">' + escapeHtml(x.name) + '</button>';
    });
    container.innerHTML = html;
    container.querySelectorAll('.category-btn').forEach(function(btn) {
        btn.onclick = function() {
            container.querySelectorAll('.category-btn').forEach(function(b) { b.classList.remove('active'); });
            this.classList.add('active');
            currentCategory = this.dataset.cat === '全部' ? '全部' : parseInt(this.dataset.cat, 10);
            renderPosts();
        };
    });
}

function renderPosts() {
    var list = document.getElementById('postList');
    var filtered = posts.filter(function(p) { return currentCategory === '全部' || p.category_id === currentCategory; });
    if (!filtered.length) { list.innerHTML = '<div class="empty-state">暂无帖子，快来抢沙发~</div>'; return; }
    
    list.innerHTML = filtered.map(function(p) {
        var name = p.users ? p.users.nickname : (p.author || '匿名');
        var avatar = p.users && p.users.avatar_url ? p.users.avatar_url : getUserAvatar({ nickname: name });
        var time = new Date(p.created_at).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        var catName = '';
        if (p.category_id) { var _cat = categories.find(function(c) { return c.id === p.category_id; }); if (_cat && _cat.name !== '未分类') catName = _cat.name; }
        
        var likeCount = p.post_likes ? p.post_likes.length : 0;
        var iLiked = p.post_likes && p.post_likes.some(function(l){ return l.user_id === currentUser.id; });
        var commentCount = p.post_comments ? p.post_comments.length : 0;
        
        var canDelete = isAdmin || (currentUser.id === p.user_id);
        var delBtn = canDelete ? '<button class="del-btn" data-id="' + p.id + '" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:0.85em;padding:4px;">删除</button>' : '';
        var reportBtn = currentUser.id !== p.user_id ? '<button class="report-btn" data-id="' + p.id + '" data-uid="' + p.user_id + '" data-snapshot="' + escapeHtml((p.content || '').substring(0,50)) + '" style="background:none;border:none;color:#F59E0B;cursor:pointer;font-size:0.85em;padding:4px;">举报</button>' : '';

        return '<div class="post-card" data-id="' + p.id + '">' +
        '<div class="post-author"><div class="avatar" style="' + (avatar.startsWith('http') ? 'background-image:url(' + avatar + ');background-size:cover;' : '') + '">' + (avatar.startsWith('http') ? '' : name.charAt(0).toUpperCase()) + '</div><span class="name">' + escapeHtml(name) + '</span>' + (catName ? '<span class="category-tag">' + escapeHtml(catName) + '</span>' : '') + '<span class="time">' + time + '</span></div>' +
        (p.title ? '<div class="post-title">' + escapeHtml(p.title) + '</div>' : '') +
        '<div class="post-content">' + (window.DOMPurify ? DOMPurify.sanitize(p.content) : escapeHtml(p.content)) + '</div>' +
        '<div class="post-footer"><div style="display:flex;gap:16px;align-items:center;">' +
        '<button class="like-btn ' + (iLiked ? 'liked' : '') + '" data-id="' + p.id + '"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg> <span>' + likeCount + '</span></button>' +
        '<span class="comment-count"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg> ' + commentCount + '</span></div>' +
        '<div style="display:flex;gap:12px;">' + reportBtn + delBtn + '</div></div></div>';
    }).join('');

    list.querySelectorAll('.post-card').forEach(function(card) { card.onclick = function(e) { if(e.target.closest('button')) return; openPostDetail(this.dataset.id); }; });
    list.querySelectorAll('.like-btn').forEach(function(btn) {
        btn.onclick = async function(e) {
            e.stopPropagation();
            var pid = this.dataset.id; var isLiked = this.classList.contains('liked'); var span = this.querySelector('span'); var count = parseInt(span.textContent, 10) || 0;
            if (isLiked) {
                this.classList.remove('liked'); span.textContent = count - 1;
                await window.sb.from('post_likes').delete().eq('post_id', pid).eq('user_id', currentUser.id);
            } else {
                this.classList.add('liked'); span.textContent = count + 1;
                await window.sb.from('post_likes').insert([{ post_id: pid, user_id: currentUser.id }]);
            }
        };
    });
    list.querySelectorAll('.del-btn').forEach(function(btn) {
        btn.onclick = async function(e) {
            e.stopPropagation();
            if (await window.showCustomConfirm('删除帖子', '确定要删除吗？')) { await window.sb.from('posts').delete().eq('id', this.dataset.id); loadAll(); }
        };
    });
    list.querySelectorAll('.report-btn').forEach(function(btn) {
        btn.onclick = async function(e) {
            e.stopPropagation();
            var reason = await window.showCustomPrompt('举报帖子', '请输入原因'); if (reason) { await window.sb.from('reports').insert([{ reporter_id: currentUser.id, reporter_name: currentUser.nickname, type: 'post', content_snapshot: this.dataset.snapshot, remark: reason, status: 'pending' }]); window.showCustomConfirm('举报成功', '已提交'); }
        };
    });
}

var activeDetailPostId = null;

async function openPostDetail(postId) {
    document.getElementById('detailOverlay').classList.add('active');
    var p = posts.find(function(x) { return x.id === postId; }); if (!p) return;
    activeDetailPostId = postId;
    var name = p.users ? p.users.nickname : (p.author || '匿名');
    var avatar = p.users && p.users.avatar_url ? p.users.avatar_url : getUserAvatar({ nickname: name });
    var time = new Date(p.created_at).toLocaleString('zh-CN');
    
    var html = '<div class="detail-post"><div class="post-author"><div class="avatar" style="' + (avatar.startsWith('http') ? 'background-image:url(' + avatar + ');background-size:cover;' : '') + '">' + (avatar.startsWith('http') ? '' : name.charAt(0).toUpperCase()) + '</div><span class="name">' + escapeHtml(name) + '</span><span class="time">' + time + '</span></div>' + (p.title ? '<div class="post-title">' + escapeHtml(p.title) + '</div>' : '') + '<div class="post-content">' + (window.DOMPurify ? DOMPurify.sanitize(p.content) : escapeHtml(p.content)) + '</div></div><div class="detail-comments" id="commentList"><div class="loading-state"><div class="spinner"></div>加载评论...</div></div>';
    document.getElementById('detailContent').innerHTML = html;
    loadComments(p.id);
}

async function loadComments(postId) {
    var cl = document.getElementById('commentList');
    const [cRes, uRes] = await Promise.all([
        window.sb.from('post_comments').select('*').eq('post_id', postId).order('created_at', { ascending: true }),
        window.sb.from('users').select('id, nickname, avatar_url')
    ]);
    
    var comments = cRes.data || [];
    var allUsers = uRes.data || [];
    var userMap = {};
    allUsers.forEach(u => userMap[u.id] = u);

    if (!comments.length) { cl.innerHTML = '<div class="empty-state">还没有评论</div>'; return; }
    
    cl.innerHTML = comments.filter(c => !c.parent_id).map(function(c) {
        var u = userMap[c.user_id];
        var cn = u ? u.nickname : (c.author || '匿名');
        var cav = u && u.avatar_url ? u.avatar_url : getUserAvatar({nickname: cn});
        var delBtn = (currentUser.id === c.user_id || isAdmin) ? '<button style="background:none;border:none;color:var(--danger);cursor:pointer;" onclick="deleteComment(\'' + c.id + '\')">删除</button>' : '';
        return '<div class="comment-item"><div class="avatar" style="' + (cav.startsWith('http') ? 'background-image:url(' + cav + ');background-size:cover;' : '') + '">' + (cav.startsWith('http') ? '' : cn.charAt(0).toUpperCase()) + '</div><div class="body"><div class="meta"><span class="name">' + escapeHtml(cn) + '</span><span class="time">' + new Date(c.created_at).toLocaleString('zh-CN', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) + '</span><div style="margin-left:auto;display:flex;gap:8px;">' + delBtn + '</div></div><div class="txt">' + escapeHtml(c.content) + '</div></div></div>';
    }).join('');
}

document.getElementById('detailSendCommentBtn').onclick = async function() {
    var input = document.getElementById('detailCommentInput'); var text = input.value.trim(); if (!text) return;
    this.disabled = true;
    try {
        if (!activeDetailPostId) return;
        await window.sb.from('post_comments').insert([{ post_id: activeDetailPostId, user_id: currentUser.id, author: currentUser.nickname, content: text }]);
        input.value = ''; loadComments(activeDetailPostId); loadAll();
    } catch(e) { window.showCustomAlert('评论失败', e.message); } finally { this.disabled = false; }
};

window.deleteComment = async function(id) {
    if (!(await window.showCustomConfirm('删除评论', '确定删除？'))) return;
    try { await window.sb.from('post_comments').delete().eq('id', id); loadComments(activeDetailPostId); loadAll(); } catch(e) {}
};
document.getElementById('closeDetail').onclick = function() { document.getElementById('detailOverlay').classList.remove('active'); };
loadAll();
</script>
</body>
</html>
